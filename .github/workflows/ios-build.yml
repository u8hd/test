name: iOS Build (unsigned IPA)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build & archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -project LiquidGlass.xcodeproj \
            -scheme LiquidGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LiquidGlass.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: Build log (último erro)
          files: ${{ runner.temp }}/build.log

      - name: Package unsigned .ipa
        run: |
          set -e
          APP_PATH="$RUNNER_TEMP/LiquidGlass.xcarchive/Products/Applications/LiquidGlass.app"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          ( cd "$RUNNER_TEMP" && zip -qr -y LiquidGlass-unsigned.ipa Payload )
          ls -lh "$RUNNER_TEMP/LiquidGlass-unsigned.ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-unsigned-ipa
          path: ${{ runner.temp }}/LiquidGlass-unsigned.ipa
          if-no-files-found: error

      - name: Publish .ipa to Release (link público)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última build (unsigned)
          body: |
            IPA não assinado gerado automaticamente a partir do commit ${{ github.sha }}.
            Link direto: baixe o arquivo LiquidGlass-unsigned.ipa abaixo.
          files: ${{ runner.temp }}/LiquidGlass-unsigned.ipa
          fail_on_unmatched_files: true
